# Bruges af cPanel → Git Version Control → "Deploy HEAD Commit",
# hvis vi deployer uden SSH. Ret DEPLOYPATH til domænets document root.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/halsedis/logomarketing.dk/
    - /bin/rsync -a --delete --exclude '.git/' --exclude '.gitignore' --exclude '.cpanel.yml' --exclude 'deploy.sh' --exclude 'supabase/' --exclude '*.md' --exclude '_headers' --exclude '_redirects' --exclude '*.zip' --exclude '*.xlsx' --exclude '.well-known/' --exclude 'cgi-bin/' ./ $DEPLOYPATH
