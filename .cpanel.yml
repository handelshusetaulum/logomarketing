# cPanel → Git Version Control → "Deploy HEAD Commit"
# Kopierer kun de offentlige filer til document root for logomarketing.dk.
# (supabase/, *.md, deploy.sh m.m. kommer aldrig ud på webserveren)
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/halsedis/logomarketing.dk/
    - /bin/cp -R index.html admin.html .htaccess robots.txt sitemap.xml $DEPLOYPATH
    - /bin/cp -R t assets $DEPLOYPATH
